<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PolarityIQ FO RAG — Demo</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; margin-bottom: 0.2rem; }
  p.subtitle { color: #666; margin-top: 0; font-size: 0.9rem; }
  textarea { width: 100%; padding: 0.6rem; font-size: 1rem; border: 1px solid #ccc;
             border-radius: 6px; box-sizing: border-box; font-family: inherit; }
  button { background: #0a0a0a; color: white; border: 0; padding: 0.6rem 1.2rem;
           border-radius: 6px; cursor: pointer; font-size: 0.95rem; margin-top: 0.5rem; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .answer { background: #f5f5f7; padding: 1rem; border-radius: 6px; margin-top: 1rem;
            white-space: pre-wrap; line-height: 1.5; }
  .sources { margin-top: 1rem; }
  .source { border: 1px solid #e5e5e5; padding: 0.7rem; border-radius: 6px; margin-bottom: 0.5rem;
            font-size: 0.9rem; }
  .source .name { font-weight: 600; }
  .source .meta { color: #666; font-size: 0.85rem; margin-top: 0.2rem; }
  .source a { color: #0066cc; text-decoration: none; }
  .examples { margin: 0.5rem 0 1rem; font-size: 0.85rem; color: #666; }
  .examples span { display: inline-block; background: #eee; padding: 0.2rem 0.5rem;
                   border-radius: 4px; margin: 0.2rem; cursor: pointer; }
</style>
</head>
<body>

<h1>PolarityIQ — Family Office RAG Demo</h1>
<p class="subtitle">50 validated FO records · Supabase pgvector · Groq Llama 3.3 70B · grounded answers with citations</p>

<div class="examples">
  Try:
  <span onclick="setQ(this)">family offices in Texas investing in real estate</span>
  <span onclick="setQ(this)">which FOs focus on climate or impact investing?</span>
  <span onclick="setQ(this)">Asian family offices with venture capital focus</span>
</div>

<textarea id="q" rows="3" placeholder="Ask anything about the 50 family offices..."></textarea>
<button id="ask" onclick="ask()">Ask</button>

<div id="result"></div>

<script>
function setQ(el) {
  document.getElementById('q').value = el.textContent;
}

async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const btn = document.getElementById('ask');
  const result = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = 'Thinking...';
  result.innerHTML = '';

  try {
    const r = await fetch('/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const data = await r.json();
    let html = `<div class="answer">${escapeHtml(data.answer)}</div>`;
    if (data.sources && data.sources.length) {
      html += '<div class="sources"><strong>Retrieved records (sources):</strong></div>';
      data.sources.forEach((s, i) => {
        html += `<div class="source">
          <div class="name">[FO_${i+1}] ${escapeHtml(s.name)} <span style="color:#999;font-weight:400">(sim ${s.similarity})</span></div>
          <div class="meta">${escapeHtml(s.location)} · ${escapeHtml(s.sectors || '—')}</div>
          <div class="meta">
            ${s.website ? `<a href="${s.website}" target="_blank">${escapeHtml(s.website)}</a>` : ''}
            ${s.linkedin_url ? ` · <a href="${s.linkedin_url}" target="_blank">LinkedIn</a>` : ''}
          </div>
        </div>`;
      });
    }
    result.innerHTML = html;
  } catch (e) {
    result.innerHTML = `<div class="answer" style="color:#c00">Error: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ask';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
